# Pushing a tag like v1.2.3 builds a signed APK and publishes it as a GitHub release,
# which is what Obtainium watches. See "Releasing" in README.md for the one-time setup.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Read the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.2.3, got $GITHUB_REF_NAME"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # A tag made on an out-of-date copy of main would release old code without any error.
      - name: Check the tag is on the latest commit of main
        run: |
          git fetch --no-tags --depth=1 origin main
          tagged="$(git rev-parse HEAD)"
          latest="$(git rev-parse FETCH_HEAD)"
          if [ "$tagged" != "$latest" ]; then
            echo "::error::$GITHUB_REF_NAME is on ${tagged:0:7} but main is at ${latest:0:7}. Run 'git fetch' first, then tag the latest main with a new version (see 'Releasing' in README.md)."
            exit 1
          fi

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing, see 'Releasing' in README.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "TRAVEL_DIARY_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build the signed APK
        env:
          TRAVEL_DIARY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TRAVEL_DIARY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TRAVEL_DIARY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease -PappVersion="$VERSION"

      - name: Check the signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "travel-diary-$VERSION.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "travel-diary-$VERSION.apk"
          --title "Travel Diary $VERSION"
          --generate-notes
